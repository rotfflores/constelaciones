<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080D21">
  <meta name="description" content="Un universo en 3D con nuestras constelaciones. Un regalo de Rotf Studio.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://rotfflores.github.io/constelaciones/">
  <meta property="og:locale" content="es_MX">
  <meta property="og:title" content="Nuestras estrellas">
  <meta property="og:description" content="Un universo de recuerdos para ti.">
  <meta property="og:image" content="https://rotfflores.github.io/constelaciones/assets/imagen-compartir.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Nuestras estrellas, escrito sobre un cielo estrellado">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Nuestras estrellas">
  <meta name="twitter:description" content="Un universo de recuerdos para ti.">
  <meta name="twitter:image" content="https://rotfflores.github.io/constelaciones/assets/imagen-compartir.jpg">
  <title>Nuestras estrellas</title>
  <link rel="stylesheet" href="css/fuentes.css?v=20261109">
  <link rel="stylesheet" href="css/estilos.css?v=20261109">
</head>
<body class="en-bienvenida">

  <!-- Universo en 3D (galaxia, constelaciones y efectos) -->
  <canvas id="cielo" class="lienzo" aria-hidden="true"></canvas>
  <div class="vineta" aria-hidden="true"></div>
  <div class="destello-pantalla" id="destello" aria-hidden="true"></div>

  <!-- Nombre de cada constelación; también son los botones para el teclado y los lectores de pantalla -->
  <div id="etiquetas" class="etiquetas" role="group" aria-label="Constelaciones"></div>
  <!-- Señales hacia constelaciones que quedaron fuera de la vista -->
  <div id="indicadores" class="indicadores" aria-hidden="true"></div>

  <!-- Barra superior -->
  <header class="barra">
    <div class="marcador" id="marcador">
      <div class="marcador__estrellas" id="marcador-estrellas" aria-hidden="true"></div>
      <p class="marcador__texto" id="progreso" aria-live="polite"></p>
    </div>
    <div class="barra__acciones">
      <button id="boton-vista" class="boton-icono" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg>
        <span class="sr-only" id="etiqueta-vista"></span>
      </button>
      <button id="boton-musica" class="boton-icono boton-musica" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 17.5V6.2l10-2.2v11.3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="6.8" cy="17.6" r="2.3" fill="none" stroke="currentColor" stroke-width="1.3"/>
          <circle cx="16.8" cy="15.4" r="2.3" fill="none" stroke="currentColor" stroke-width="1.3"/>
          <path class="tachado" d="M4 4l16 16" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        <span class="boton-musica__texto" aria-hidden="true">Música</span>
        <span class="sr-only" id="etiqueta-musica"></span>
      </button>
    </div>
  </header>

  <!-- 1. Bienvenida -->
  <section id="bienvenida" class="bienvenida" aria-labelledby="mensaje-bienvenida">
    <div class="bienvenida__contenido">
      <p class="bienvenida__para" id="para-quien"></p>
      <h1 class="bienvenida__mensaje" id="mensaje-bienvenida"></h1>
      <span class="ornamento" aria-hidden="true"></span>
      <button id="boton-entrar" class="boton boton--principal" type="button">
        <span id="texto-entrar"></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.6 6.4L20 11l-6.4 1.6L12 19l-1.6-6.4L4 11l6.4-1.6z" fill="currentColor"/></svg>
      </button>
    </div>
    <p class="marca" id="marca"></p>
  </section>

  <!-- 2. Ayuda para navegar -->
  <div id="ayuda" class="ayuda" role="status">
    <span class="ayuda__gesto" aria-hidden="true"><span></span></span>
    <span class="ayuda__textos">
      <span class="ayuda__principal" id="ayuda-principal"></span>
      <span class="ayuda__secundaria" id="ayuda-secundaria"></span>
    </span>
  </div>

  <!-- Zoom (computadora) -->
  <div class="zoom" id="controles-zoom">
    <button id="boton-acercar" class="boton-icono" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <span class="sr-only" id="etiqueta-acercar"></span>
    </button>
    <button id="boton-alejar" class="boton-icono" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <span class="sr-only" id="etiqueta-alejar"></span>
    </button>
  </div>

  <!-- 3. Momento interactivo de cada constelación -->
  <section id="momento" class="momento" aria-labelledby="momento-nombre" tabindex="-1" hidden>
    <div class="momento__cabecera">
      <p class="momento__forma" id="momento-forma"></p>
      <h2 class="momento__nombre" id="momento-nombre"></h2>
      <p class="momento__indicacion" id="momento-indicacion" aria-live="polite"></p>
      <div class="momento__puntos" id="momento-puntos" aria-hidden="true"></div>
    </div>
    <div class="momento__acciones">
      <button id="boton-volver" class="boton boton--cristal" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="texto-volver"></span>
      </button>
    </div>
  </section>
  <!-- Nombres, frases y anillo de progreso que acompañan al momento -->
  <div id="capa-momento" class="capa-momento" aria-hidden="true">
    <svg id="anillo" class="anillo" viewBox="0 0 100 100">
      <circle class="anillo__pista" cx="50" cy="50" r="44"/>
      <circle class="anillo__progreso" id="anillo-progreso" cx="50" cy="50" r="44"/>
    </svg>
  </div>
  <div id="botones-momento" class="botones-momento"></div>
  <p id="anuncio" class="sr-only" aria-live="polite"></p>

  <!-- Recuerdo: la tarjeta llega de espaldas y se voltea -->
  <div id="recuerdo" class="velo" hidden>
    <article class="recuerdo" role="dialog" aria-modal="true" aria-labelledby="recuerdo-titulo" tabindex="-1">
      <span class="recuerdo__polvo" aria-hidden="true"></span>
      <span class="recuerdo__marca-agua" id="recuerdo-marca-agua" aria-hidden="true"></span>
      <div class="recuerdo__desplazable" id="recuerdo-desplazable">
        <!-- Galería de fotos instantáneas (recuerdo.fotos) -->
        <div class="recuerdo__galeria" id="recuerdo-galeria" hidden></div>
        <figure class="recuerdo__foto" id="recuerdo-figura" hidden>
          <img id="recuerdo-imagen" alt="" decoding="async">
        </figure>
        <!-- Lámina con la constelación, para los recuerdos sin foto -->
        <div class="recuerdo__lamina" id="recuerdo-lamina" aria-hidden="true" hidden>
          <svg class="recuerdo__carta-celeste" viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice">
            <circle cx="200" cy="100" r="62"/>
            <circle cx="200" cy="100" r="98" class="punteado"/>
            <circle cx="200" cy="100" r="138"/>
            <circle cx="200" cy="100" r="182" class="punteado"/>
            <path d="M200 -40V240M-20 100H420"/>
          </svg>
          <svg class="recuerdo__mapa" id="recuerdo-mapa" preserveAspectRatio="xMidYMid meet"></svg>
          <canvas class="recuerdo__vitrina" id="recuerdo-vitrina"></canvas>
          <p class="recuerdo__gira" id="recuerdo-gira"></p>
          <p class="recuerdo__rotulo"><span id="recuerdo-numero"></span><span id="recuerdo-forma"></span></p>
        </div>
        <div class="recuerdo__texto">
          <span class="recuerdo__sello" aria-hidden="true"><span id="recuerdo-sello"></span></span>
          <p class="recuerdo__fecha" id="recuerdo-fecha"></p>
          <h2 class="recuerdo__titulo" id="recuerdo-titulo"></h2>
          <span class="recuerdo__separador" aria-hidden="true"></span>
          <p class="recuerdo__mensaje" id="recuerdo-mensaje"></p>
          <ul class="recuerdo__lista" id="recuerdo-lista" hidden></ul>
          <!-- Sorpresa que desbloquea el recuerdo (recuerdo.sorpresa) -->
          <div class="recuerdo__sorpresa" id="recuerdo-sorpresa" hidden></div>
          <button id="boton-cerrar-recuerdo" class="boton boton--contorno" type="button"></button>
        </div>
      </div>
      <!-- Adornos: marco dorado vivo, esquinas de astrolabio y destellos -->
      <span class="recuerdo__marco" aria-hidden="true"></span>
      <span class="recuerdo__esquinas" aria-hidden="true">
        <svg class="esquina esquina--1" viewBox="0 0 34 34"><path class="esquina__linea" d="M2 23V6a4 4 0 0 1 4-4h17"/><path class="esquina__estrella" d="M9.5 5.2l1.1 3.2 3.2 1.1-3.2 1.1-1.1 3.2-1.1-3.2-3.2-1.1 3.2-1.1z"/><circle cx="27" cy="2" r="1.3"/><circle cx="2" cy="27" r="1.3"/></svg>
        <svg class="esquina esquina--2" viewBox="0 0 34 34"><path class="esquina__linea" d="M2 23V6a4 4 0 0 1 4-4h17"/><path class="esquina__estrella" d="M9.5 5.2l1.1 3.2 3.2 1.1-3.2 1.1-1.1 3.2-1.1-3.2-3.2-1.1 3.2-1.1z"/><circle cx="27" cy="2" r="1.3"/><circle cx="2" cy="27" r="1.3"/></svg>
        <svg class="esquina esquina--3" viewBox="0 0 34 34"><path class="esquina__linea" d="M2 23V6a4 4 0 0 1 4-4h17"/><path class="esquina__estrella" d="M9.5 5.2l1.1 3.2 3.2 1.1-3.2 1.1-1.1 3.2-1.1-3.2-3.2-1.1 3.2-1.1z"/><circle cx="27" cy="2" r="1.3"/><circle cx="2" cy="27" r="1.3"/></svg>
        <svg class="esquina esquina--4" viewBox="0 0 34 34"><path class="esquina__linea" d="M2 23V6a4 4 0 0 1 4-4h17"/><path class="esquina__estrella" d="M9.5 5.2l1.1 3.2 3.2 1.1-3.2 1.1-1.1 3.2-1.1-3.2-3.2-1.1 3.2-1.1z"/><circle cx="27" cy="2" r="1.3"/><circle cx="2" cy="27" r="1.3"/></svg>
      </span>
      <span class="recuerdo__brillo" aria-hidden="true"></span>
      <button class="recuerdo__aviso" id="recuerdo-aviso" type="button" hidden>
        <span id="recuerdo-aviso-texto"></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9.5l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <!-- Reverso: se ve mientras la tarjeta se voltea -->
      <div class="recuerdo__dorso" aria-hidden="true">
        <div class="recuerdo__dorso-contenido">
          <div class="recuerdo__dorso-emblema">
            <svg class="recuerdo__dorso-anillos" viewBox="0 0 200 200">
              <circle cx="100" cy="100" r="96" class="punteado"/>
              <circle cx="100" cy="100" r="84"/>
              <circle cx="100" cy="100" r="58" class="punteado"/>
              <path d="M100 0v22M100 178v22M0 100h22M178 100h22M29 29l14 14M157 157l14 14M29 171l14-14M157 43l14-14"/>
            </svg>
            <svg class="recuerdo__dorso-figura" id="recuerdo-dorso-figura" preserveAspectRatio="xMidYMid meet"></svg>
          </div>
          <p class="recuerdo__dorso-numero" id="recuerdo-dorso-numero"></p>
          <p class="recuerdo__dorso-forma" id="recuerdo-dorso-forma"></p>
        </div>
      </div>
    </article>
  </div>

  <!-- Mapa estelar: el cielo real de una noche y un lugar (constelación con "mapaEstelar").
       Lo arma js/mapa-estelar.js: la carta en 3D, el cartel, la vista desde el lugar y la barra de horas. -->
  <section id="mapa" class="mapa" hidden></section>

  <!-- La línea de la canción que suena, mientras se explora el cielo -->
  <p class="letra-viva" id="letra-viva" aria-hidden="true">
    <svg class="letra-viva__nota" viewBox="0 0 24 24"><path d="M9 17.5V6.2l10-2.2v11.3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.8" cy="17.6" r="2.3" fill="currentColor"/><circle cx="16.8" cy="15.4" r="2.3" fill="currentColor"/></svg>
    <span class="letra-viva__texto" id="letra-viva-texto"></span>
  </p>

  <!-- 4. Final -->
  <section id="final" class="final" aria-live="polite" hidden>
    <p class="final__previo" id="final-previo"></p>
    <p class="final__mensaje" id="final-mensaje"></p>
    <button id="boton-carta" class="boton boton--principal" type="button"></button>
  </section>
  <button id="boton-leer-carta" class="boton boton--cristal leer-carta" type="button" hidden></button>

  <div id="carta" class="velo velo--carta" hidden>
    <article class="carta" role="dialog" aria-modal="true" aria-labelledby="carta-saludo" tabindex="-1">
      <span class="carta__sello" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 2l1.9 7.6L21.5 12l-7.6 2.4L12 22l-1.9-7.6L2.5 12l7.6-2.4z" fill="currentColor"/></svg>
      </span>
      <h2 class="carta__saludo" id="carta-saludo"></h2>
      <div class="carta__cuerpo" id="carta-cuerpo"></div>
      <p class="carta__despedida" id="carta-despedida"></p>
      <p class="carta__firma" id="carta-firma"></p>
      <div class="carta__acciones">
        <button id="boton-repetir" class="boton boton--principal" type="button"></button>
        <button id="boton-contemplar" class="boton boton--sutil" type="button"></button>
      </div>
    </article>
  </div>

  <!-- Si el navegador no puede mostrar 3D, los recuerdos y la carta siguen aquí -->
  <section id="sin-3d" class="sin-3d" hidden>
    <div class="sin-3d__contenido">
      <p class="bienvenida__para" id="sin-3d-para"></p>
      <h1 class="sin-3d__titulo" id="sin-3d-titulo"></h1>
      <p class="sin-3d__aviso" id="sin-3d-aviso"></p>
      <div id="sin-3d-recuerdos"></div>
      <div class="carta carta--plana" id="sin-3d-carta"></div>
    </div>
  </section>

  <noscript><p class="sin-js">Esta experiencia necesita JavaScript para mostrar el cielo.</p></noscript>

  <script src="js/configuracion.js?v=20261109"></script>
  <script src="js/vendor/three.min.js?v=20261109"></script>
  <script src="js/nucleo.js?v=20261109"></script>
  <script src="js/universo.js?v=20261109"></script>
  <script src="js/controles.js?v=20261109"></script>
  <script src="js/rituales.js?v=20261109"></script>
  <script src="js/musica.js?v=20261109"></script>
  <script src="js/sorpresas.js?v=20261109"></script>
  <script src="js/vendor/astronomy.min.js?v=20261109"></script>
  <script src="js/mapa-datos.js?v=20261109"></script>
  <script src="js/mapa-estelar.js?v=20261109"></script>
  <script src="js/experiencia.js?v=20261109"></script>
</body>
</html>
