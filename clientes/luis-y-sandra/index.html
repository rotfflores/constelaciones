<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Nuestras estrellas</title>
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
      background: radial-gradient(ellipse at 50% 40%, #1b2147 0%, #0b0e22 60%, #05060f 100%);
      color: #f3ecdc; font-family: Georgia, "Times New Roman", serif; text-align: center;
    }
    .caja { max-width: 360px; }
    .estrella { font-size: 44px; color: #e8c983; text-shadow: 0 0 24px rgba(232, 201, 131, .6); animation: brillo 3s ease-in-out infinite; }
    h1 { font-weight: normal; font-size: 28px; margin: 18px 0 12px; }
    p { font-size: 17px; line-height: 1.6; color: #c9c3d8; margin: 0; }
    .marca { margin-top: 40px; font-family: system-ui, sans-serif; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #6f6a88; }
    @keyframes brillo { 50% { opacity: .55; } }
  </style>
</head>
<body>
  <main class="caja">
    <div class="estrella" aria-hidden="true">✦</div>
    <h1>Este cielo aún no se abre</h1>
    <p>El regalo todavía se está preparando. Muy pronto sus estrellas van a brillar aquí.</p>
    <p class="marca">Rotf Studio</p>
  </main>
</body>
</html>
